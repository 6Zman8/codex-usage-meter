name: Build release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Build single executable
        shell: pwsh
        run: |
          .\build.ps1
          $file = Get-Item -LiteralPath '.\bin\CodexUsageMeter.exe'
          $actual = [version]$file.VersionInfo.FileVersion
          $actualTag = "v$($actual.Major).$($actual.Minor).$($actual.Build)"
          if ($actualTag -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME does not match executable version $actualTag"
          }

      - name: Verify Chrome subscription userscript
        shell: pwsh
        run: node browser/subscription.test.cjs

      - name: Build and verify Windows widget provider
        shell: pwsh
        run: |
          .\build-windows-widget.ps1
          [xml]$manifest = Get-Content -LiteralPath '.\bin\windows-widget\package\AppxManifest.xml' -Raw
          $mainVersion = [version](Get-Item -LiteralPath '.\bin\CodexUsageMeter.exe').VersionInfo.FileVersion
          if ([version]$manifest.Package.Identity.Version -ne $mainVersion) { throw 'Widget package version does not match the meter' }

      - name: Verify shortcut activation, tray quota and Windows widget bridge
        shell: pwsh
        run: |
          foreach ($kind in @('single-instance', 'tray-usage', 'windows-widget', 'resume-refresh', 'phone-remote')) {
            $result = "$kind-self-test.txt"
            $test = Start-Process -FilePath '.\bin\CodexUsageMeter.exe' -ArgumentList "--$kind-self-test $result" -WindowStyle Hidden -PassThru
            if (-not $test.WaitForExit(30000)) { throw "$kind verification timed out" }
            Get-Content -LiteralPath $result
            if ($test.ExitCode -ne 0) { throw "$kind verification failed" }
          }

      - name: Verify update dialog and Korean release notes
        shell: pwsh
        run: |
          $test = Start-Process -FilePath '.\bin\CodexUsageMeter.exe' -ArgumentList '--update-ui-self-test update-ui-self-test.txt' -WindowStyle Hidden -PassThru
          if (-not $test.WaitForExit(30000)) {
            throw 'Update UI verification timed out'
          }
          Get-Content -LiteralPath '.\update-ui-self-test.txt'
          if ($test.ExitCode -ne 0) {
            throw 'Update UI verification failed'
          }

      - name: Verify quota parsing and displays
        shell: pwsh
        run: |
          $test = Start-Process -FilePath '.\bin\CodexUsageMeter.exe' -ArgumentList '--rate-limit-self-test rate-limit-self-test.txt' -WindowStyle Hidden -PassThru
          if (-not $test.WaitForExit(30000)) {
            throw 'Rate-limit verification timed out'
          }
          Get-Content -LiteralPath '.\rate-limit-self-test.txt'
          if ($test.ExitCode -ne 0) {
            throw 'Rate-limit verification failed'
          }

      - name: Verify account usage history and pre-reset remaining quota
        shell: pwsh
        run: |
          $test = Start-Process -FilePath '.\bin\CodexUsageMeter.exe' -ArgumentList '--usage-history-self-test usage-history-self-test.txt' -WindowStyle Hidden -PassThru
          if (-not $test.WaitForExit(30000)) {
            throw 'Usage history verification timed out'
          }
          Get-Content -LiteralPath '.\usage-history-self-test.txt'
          if ($test.ExitCode -ne 0) {
            throw 'Usage history verification failed'
          }

      - name: Verify editable layouts without live accounts
        shell: pwsh
        run: |
          $test = Start-Process -FilePath '.\bin\CodexUsageMeter.exe' -ArgumentList '--layout-self-test layout-self-test.txt' -WindowStyle Hidden -PassThru
          if (-not $test.WaitForExit(180000)) {
            throw 'Layout verification timed out'
          }
          Get-Content -LiteralPath '.\layout-self-test.txt'
          if ($test.ExitCode -ne 0) {
            throw 'Layout verification failed'
          }

      - name: Verify account switching without live accounts
        shell: pwsh
        run: |
          $test = Start-Process -FilePath '.\bin\CodexUsageMeter.exe' -ArgumentList '--account-switch-self-test account-switch-self-test.txt' -WindowStyle Hidden -PassThru
          if (-not $test.WaitForExit(30000)) {
            throw 'Account switch verification timed out'
          }
          Get-Content -LiteralPath '.\account-switch-self-test.txt'
          if ($test.ExitCode -ne 0) {
            throw 'Account switch verification failed'
          }

      - name: Build and verify the Android phone app
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          $env:JAVA_HOME = $env:JAVA_HOME_17_X64
          $sdkmanager = Join-Path $env:ANDROID_HOME 'cmdline-tools\latest\bin\sdkmanager.bat'
          & $sdkmanager --install 'platforms;android-37.2' 'build-tools;36.0.0'
          if ($LASTEXITCODE -ne 0) { throw 'Android SDK install failed' }
          $keystore = Join-Path $env:RUNNER_TEMP 'codexremote-release.jks'
          [IO.File]::WriteAllBytes($keystore, [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))
          $env:ANDROID_KEYSTORE_PATH = $keystore
          foreach ($name in 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD') { Set-Item "env:$name" ((Get-Item "env:$name").Value.Trim()) }
          Push-Location android
          try {
            .\gradlew.bat --no-daemon testDebugUnitTest releaseAssets
            if ($LASTEXITCODE -ne 0) { throw 'Android app build failed' }
          } finally {
            Pop-Location
            Remove-Item -LiteralPath $keystore -ErrorAction SilentlyContinue
          }
          $assets = '.\android\app\build\release-assets'
          $info = Get-Content -LiteralPath "$assets\CodexMeterRemote.json" -Raw | ConvertFrom-Json
          $apk = Get-Item -LiteralPath "$assets\CodexMeterRemote.apk"
          if ((Get-FileHash -LiteralPath $apk.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne $info.sha256) { throw 'APK hash does not match CodexMeterRemote.json' }
          $version = ConvertFrom-StringData (Get-Content -LiteralPath '.\android\version.properties' -Raw)
          if ([int]$version.versionCode -ne [int]$info.versionCode -or $version.versionName -ne $info.versionName) { throw 'CodexMeterRemote.json does not match android/version.properties' }
          # An APK signed with any other key cannot update the installed app, so publish only the release key's signature.
          $certs = & (Join-Path $env:ANDROID_HOME 'build-tools\36.0.0\apksigner.bat') verify --print-certs $apk.FullName
          if ($LASTEXITCODE -ne 0) { throw 'APK signature verification failed' }
          if (-not ($certs -match 'certificate SHA-256 digest: b012b8c890e26aec30da51aea81e7329db592a5d9067147c7a5fc877363d27fd')) { throw "APK is not signed with the phone app release key: $certs" }
          "Phone app $($info.versionName) ($($info.versionCode)) $($apk.Length) bytes sha256=$($info.sha256)"

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME '.\bin\CodexUsageMeter.exe#CodexUsageMeter.exe' '.\bin\windows-widget\CodexUsageMeter.WindowsWidget.zip#CodexUsageMeter.WindowsWidget.zip' '.\android\app\build\release-assets\CodexMeterRemote.apk#CodexMeterRemote.apk' '.\android\app\build\release-assets\CodexMeterRemote.json#CodexMeterRemote.json' --verify-tag --notes-file '.\docs\releases\update-summary.txt' --title "Codex Usage Meter $env:GITHUB_REF_NAME"
