<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PC 리모컨 앱 시안</title>
<style>
  :root {
    --bg: #151515; --card: #1B1B1B; --line: #343434; --text: #F4F4F5; --muted: #A1A1AA;
    --off: #38BDF8; --off-soft: rgba(56, 189, 248, .24); --sleep: #FBBF24; --sleep-soft: rgba(251, 191, 36, .24);
    --good: #8DE0C4; --bad: #FCA5A5; --radius: 24px;
    --page: #0E0E10;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--text);
    font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  .intro { max-width: 1100px; margin: 0 auto; padding: 24px 20px 4px; }
  .intro h1 { margin: 0 0 6px; font-size: 22px; }
  .intro p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.55; }
  .grid { max-width: 1100px; margin: 0 auto; padding: 18px 20px 40px; display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 28px 22px; }
  figure { margin: 0; }
  figcaption { margin-top: 10px; font-size: 13.5px; line-height: 1.5; color: var(--muted); }
  figcaption b { color: var(--text); }
  .phone { width: 100%; max-width: 330px; height: 660px; margin: 0 auto; background: var(--bg); border: 1px solid #2A2A2E;
    border-radius: 32px; padding: 18px 14px 16px; display: flex; flex-direction: column; gap: 12px; overflow: hidden; }
  .bar { display: flex; align-items: center; gap: 8px; min-height: 44px; }
  .bar h2 { margin: 0 0 0 4px; font-size: 17px; font-weight: 650; flex: 1; }
  .icon-btn { width: 44px; height: 44px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); color: var(--muted);
    display: grid; place-items: center; font: inherit; cursor: pointer; }
  .icon-btn svg { width: 22px; height: 22px; }
  .tabs { display: flex; gap: 8px; }
  .tab { flex: 1; min-height: 52px; border-radius: 16px; border: 1px solid var(--line); background: var(--card); color: var(--muted);
    font: inherit; font-size: 15px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; padding: 6px 12px; cursor: pointer; }
  .tab strong { font-size: 15px; font-weight: 600; }
  .tab span { font-size: 12px; display: flex; align-items: center; gap: 5px; }
  .tab .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); }
  .tab .dot.bad { background: var(--bad); }
  .tab[aria-selected="true"] { border-color: var(--text); color: var(--text); background: #232325; }
  .big { position: relative; flex: 1; min-height: 140px; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); color: inherit; font: inherit; cursor: pointer; }
  .big.off { --tone: var(--off); --soft: var(--off-soft); }
  .big.sleep { --tone: var(--sleep); --soft: var(--sleep-soft); }
  .big svg { width: 58px; height: 58px; color: var(--tone); position: relative; }
  .big b { font-size: 30px; position: relative; }
  .big small { font-size: 15px; color: var(--muted); position: relative; }
  .big.active { border-color: var(--tone); }
  .big.active small { color: var(--text); }
  .big .fill { position: absolute; left: 0; right: 0; bottom: 0; background: var(--soft); box-shadow: inset 0 3px 0 var(--tone); }
  .big[disabled] { cursor: default; border-style: dashed; }
  .big[disabled] svg, .big[disabled] b { opacity: .35; }
  .status { min-height: 42px; margin: 0 4px; font-size: 14px; line-height: 1.45; color: var(--muted); text-align: center; }
  .status.good { color: var(--good); }
  .status.bad { color: var(--bad); }
  .notice { border: 1px solid #5A4A1E; background: #221D10; border-radius: 16px; padding: 12px 14px; font-size: 14px; line-height: 1.45; }
  .notice.bad { border-color: #5B2B2B; background: #241414; }
  .notice p { margin: 0 0 10px; }
  .row-btns { display: flex; gap: 8px; }
  .btn { min-height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line); background: #262628; color: var(--text); font: inherit; font-size: 14.5px; font-weight: 600; cursor: pointer; }
  .btn.primary { background: var(--text); color: #111; border-color: var(--text); }
  .btn.wide { width: 100%; }
  .empty { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 14px; padding: 0 8px; }
  .empty h3 { margin: 0; font-size: 22px; line-height: 1.35; }
  .empty ol { margin: 0; padding-left: 20px; color: var(--muted); font-size: 14.5px; line-height: 1.6; }
  .list { display: flex; flex-direction: column; gap: 10px; }
  .item { border: 1px solid var(--line); background: var(--card); border-radius: 18px; padding: 12px 12px 12px 14px; display: flex; align-items: center; gap: 10px; }
  .item div { flex: 1; min-width: 0; }
  .item strong { display: block; font-size: 16px; }
  .item span { font-size: 12.5px; color: var(--muted); }
  .hint { font-size: 13px; color: var(--muted); line-height: 1.5; margin: 2px 4px 0; }
  .sheet-title { font-size: 13px; color: var(--muted); margin: 6px 4px 0; }
  /* PC 설정 화면 */
  .pc { width: 100%; max-width: 330px; margin: 0 auto; background: #1E1E20; border: 1px solid #2A2A2E; border-radius: 14px; padding: 16px; font-size: 14px; }
  .pc h3 { margin: 0 0 3px; font-size: 15px; }
  .pc .muted { color: var(--muted); font-size: 13px; line-height: 1.5; margin: 0 0 12px; }
  .switch { float: right; width: 42px; height: 24px; border-radius: 12px; background: #3B82F6; position: relative; }
  .switch::after { content: ""; position: absolute; right: 3px; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; }
  .steps { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 8px; }
  .step { text-align: center; font-size: 12.5px; color: var(--muted); line-height: 1.45; }
  .step b { display: block; color: var(--text); font-size: 13.5px; margin-bottom: 6px; }
  .qr { width: 100%; aspect-ratio: 1; background: #fff; border-radius: 8px; padding: 8px; margin-bottom: 6px; }
  .qr svg { width: 100%; height: 100%; display: block; }
  .pcname { margin-top: 12px; display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
  .pcname input { flex: 1; min-height: 36px; border-radius: 8px; border: 1px solid #3A3A3E; background: #141416; color: var(--text); padding: 0 10px; font: inherit; }
  @media (prefers-reduced-motion: no-preference) { .big .fill { transition: height .2s; } }
</style>
</head>
<body>
<header class="intro">
  <h1>PC 리모컨 앱 시안</h1>
  <p>지금 Chrome 리모컨과 같은 색·꾹 누르기 방식을 그대로 옮긴 Android 앱입니다. 'PC를 고른 뒤 큰 버튼' 방식이며, PC 이름·주소는 예시입니다.</p>
</header>
<main class="grid">

  <figure>
    <div class="phone" id="s-empty">
      <div class="bar"><h2>PC 리모컨</h2></div>
      <div class="empty">
        <h3>아직 등록한 PC가 없습니다</h3>
        <ol>
          <li>PC 미터기에서 <b>⚙ 설정 → 폰 리모컨</b>을 켭니다.</li>
          <li>아래 버튼을 누르고 PC 화면의 <b>PC 등록 QR</b>을 찍습니다.</li>
        </ol>
        <button class="btn primary wide" type="button">QR 찍어서 PC 추가</button>
        <p class="hint">처음 한 번 '근처 기기(같은 와이파이) 접근'을 물으면 허용을 눌러 주세요.</p>
      </div>
    </div>
    <figcaption><b>A · 처음 실행</b> — PC가 없으면 QR로 추가하는 방법만 보여 줍니다. Chrome에서 막혔던 권한은 앱이 직접 물어봅니다.</figcaption>
  </figure>

  <figure>
    <div class="phone" id="s-main">
      <div class="bar"><h2>PC 리모컨</h2>
        <button class="icon-btn" type="button" aria-label="PC 관리"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button></div>
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" aria-selected="true" type="button"><strong>데스크톱</strong><span><i class="dot"></i>연결됨</span></button>
        <button class="tab" role="tab" aria-selected="false" type="button"><strong>노트북</strong><span><i class="dot"></i>연결됨</span></button>
      </div>
      <button class="big off" type="button"><span class="fill" style="height:0"></span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
        <b>화면 끄기</b><small>꾹 누르기</small></button>
      <button class="big sleep" type="button"><span class="fill" style="height:0"></span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        <b>절전</b><small>꾹 누르기</small></button>
      <div class="status" role="status"></div>
    </div>
    <figcaption><b>B · 기본 화면</b> — 위에서 PC를 고르고 아래 큰 버튼을 꾹 누릅니다. 탭마다 연결 상태가 보이고, 마지막에 쓴 PC가 다음에도 먼저 선택됩니다.</figcaption>
  </figure>

  <figure>
    <div class="phone" id="s-hold">
      <div class="bar"><h2>PC 리모컨</h2>
        <button class="icon-btn" type="button" aria-label="PC 관리"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button></div>
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" aria-selected="true" type="button"><strong>데스크톱</strong><span><i class="dot"></i>연결됨</span></button>
        <button class="tab" role="tab" aria-selected="false" type="button"><strong>노트북</strong><span><i class="dot"></i>연결됨</span></button>
      </div>
      <button class="big off active" type="button"><span class="fill" style="height:62%"></span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
        <b>화면 끄기</b><small>계속 누르세요</small></button>
      <button class="big sleep" type="button"><span class="fill" style="height:0"></span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        <b>절전</b><small>꾹 누르기</small></button>
      <div class="status good" role="status">데스크톱 화면을 껐습니다.</div>
    </div>
    <figcaption><b>C · 꾹 누르는 중 → 완료</b> — 지금처럼 1.2초 동안 게이지가 차면 진동과 함께 실행되고, 손을 떼면 취소됩니다. 결과는 아래 한 줄로 알려 줍니다.</figcaption>
  </figure>

  <figure>
    <div class="phone" id="s-offline">
      <div class="bar"><h2>PC 리모컨</h2>
        <button class="icon-btn" type="button" aria-label="PC 관리"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button></div>
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" aria-selected="false" type="button"><strong>데스크톱</strong><span><i class="dot"></i>연결됨</span></button>
        <button class="tab" role="tab" aria-selected="true" type="button"><strong>노트북</strong><span><i class="dot bad"></i>연결 안 됨</span></button>
      </div>
      <div class="notice bad">
        <p>노트북에 연결할 수 없습니다. 노트북이 켜져 있고 같은 와이파이에 연결돼 있는지, 미터기의 폰 리모컨이 켜져 있는지 확인하세요.</p>
        <div class="row-btns"><button class="btn" type="button">다시 확인</button><button class="btn" type="button">QR 다시 찍기</button></div>
      </div>
      <button class="big off" type="button" disabled><span class="fill" style="height:0"></span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
        <b>화면 끄기</b><small>연결되면 누를 수 있습니다</small></button>
      <button class="big sleep" type="button" disabled><span class="fill" style="height:0"></span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        <b>절전</b><small>연결되면 누를 수 있습니다</small></button>
    </div>
    <figcaption><b>D · 연결 안 됨</b> — 꺼져 있거나 이미 절전 중인 PC는 버튼을 흐리게 하고 이유와 할 일을 보여 줍니다. PC 주소가 바뀌었으면 QR을 다시 찍으면 됩니다.</figcaption>
  </figure>

  <figure>
    <div class="phone" id="s-manage">
      <div class="bar">
        <button class="icon-btn" type="button" aria-label="뒤로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
        <h2>PC 관리</h2></div>
      <div class="list">
        <div class="item"><div><strong>데스크톱</strong><span>192.168.0.107 · 연결됨</span></div><button class="btn" type="button">이름 바꾸기</button></div>
        <div class="item"><div><strong>노트북</strong><span>192.168.0.25 · 연결 안 됨</span></div><button class="btn" type="button">이름 바꾸기</button></div>
      </div>
      <button class="btn primary wide" type="button">QR 찍어서 PC 추가</button>
      <p class="hint">PC를 길게 누르면 순서 바꾸기·삭제가 나옵니다. 같은 PC의 QR을 다시 찍으면 새로 추가되지 않고 주소만 고쳐집니다.</p>
      <p class="sheet-title">앱 정보</p>
      <div class="item"><div><strong>버전 1.0.0</strong><span>최신 버전입니다</span></div><button class="btn" type="button">업데이트 확인</button></div>
    </div>
    <figcaption><b>E · PC 관리</b> — 오른쪽 위 버튼으로 들어옵니다. PC 추가·이름 바꾸기·삭제, 앱 업데이트 확인을 여기서 합니다.</figcaption>
  </figure>

  <figure>
    <div class="phone" id="s-update">
      <div class="bar"><h2>PC 리모컨</h2>
        <button class="icon-btn" type="button" aria-label="PC 관리"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button></div>
      <div class="notice">
        <p>새 버전 1.1.0이 나왔습니다.</p>
        <div class="row-btns"><button class="btn primary" type="button">업데이트</button><button class="btn" type="button">나중에</button></div>
      </div>
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" aria-selected="true" type="button"><strong>데스크톱</strong><span><i class="dot"></i>연결됨</span></button>
        <button class="tab" role="tab" aria-selected="false" type="button"><strong>노트북</strong><span><i class="dot"></i>연결됨</span></button>
      </div>
      <button class="big off" type="button"><span class="fill" style="height:0"></span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
        <b>화면 끄기</b><small>꾹 누르기</small></button>
      <button class="big sleep" type="button"><span class="fill" style="height:0"></span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        <b>절전</b><small>꾹 누르기</small></button>
    </div>
    <figcaption><b>F · 업데이트 알림</b> — 앱을 열 때 GitHub에 새 버전이 있으면 위에 알려 줍니다. '업데이트'를 누르면 받아서 Android 설치 화면을 띄웁니다.</figcaption>
  </figure>

  <figure>
    <div class="pc" id="s-pc">
      <span class="switch" aria-hidden="true"></span>
      <h3>폰 리모컨</h3>
      <p class="muted">같은 와이파이의 폰 앱에서 화면 끄기·절전을 꾹 눌러 실행합니다.</p>
      <div class="steps">
        <div class="step"><b>① 폰에 앱 설치</b><div class="qr" data-seed="7"></div>폰 카메라로 찍어 앱을 받습니다. 한 번만 하면 됩니다.</div>
        <div class="step"><b>② PC 등록</b><div class="qr" data-seed="23"></div>앱의 'QR 찍어서 PC 추가'로 찍습니다.</div>
      </div>
      <div class="pcname">앱에 보일 이름 <input value="데스크톱" aria-label="앱에 보일 이름"></div>
    </div>
    <figcaption><b>G · PC 미터기 설정</b> — Chrome 페이지 링크 대신 '앱 설치 QR'과 'PC 등록 QR' 두 개를 보여 줍니다(QR 무늬는 예시). 노트북 미터기에서도 같은 화면으로 등록합니다.</figcaption>
  </figure>

</main>
<script>
  // Placeholder QR-like pattern so the frame reads as a QR code; not a real code.
  document.querySelectorAll('.qr').forEach(function (box) {
    var n = 21, seed = +box.dataset.seed, cells = '';
    function rnd() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
    function finder(x, y) { return '<rect x="' + x + '" y="' + y + '" width="7" height="7"/><rect x="' + (x + 1) + '" y="' + (y + 1) + '" width="5" height="5" fill="#fff"/><rect x="' + (x + 2) + '" y="' + (y + 2) + '" width="3" height="3"/>'; }
    for (var y = 0; y < n; y++) for (var x = 0; x < n; x++) {
      var inFinder = (x < 8 && y < 8) || (x > 12 && y < 8) || (x < 8 && y > 12);
      if (!inFinder && rnd() > .52) cells += '<rect x="' + x + '" y="' + y + '" width="1" height="1"/>';
    }
    box.innerHTML = '<svg viewBox="0 0 21 21" shape-rendering="crispEdges" aria-hidden="true"><g fill="#111">' + cells + finder(0, 0) + finder(14, 0) + finder(0, 14) + '</g></svg>';
  });
</script>
</body>
</html>
