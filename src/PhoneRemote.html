<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#151515">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PC 리모컨">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>PC 리모컨</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #151515; color: #F4F4F5; overscroll-behavior: none;
    font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  main { height: 100%; display: flex; flex-direction: column; gap: 14px;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); }
  h1 { margin: 4px 4px 0; font-size: 16px; font-weight: 600; color: #A1A1AA; }
  button { position: relative; flex: 1; min-height: 150px; overflow: hidden; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px; border: 1px solid #343434; border-radius: 24px;
    background: #1B1B1B; color: inherit; font: inherit; touch-action: none; cursor: pointer; }
  button[data-tone="off"] { --tone: #38BDF8; --soft: rgba(56, 189, 248, .24); }
  button[data-tone="sleep"] { --tone: #FBBF24; --soft: rgba(251, 191, 36, .24); }
  button.active { border-color: var(--tone); }
  .fill { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: var(--soft); box-shadow: inset 0 3px 0 var(--tone); pointer-events: none; }
  svg, b, small { position: relative; pointer-events: none; }
  svg { width: 64px; height: 64px; color: var(--tone); }
  b { font-size: 32px; }
  small { font-size: 16px; color: #A1A1AA; }
  button.active small { color: #F4F4F5; }
  #status { min-height: 44px; margin: 0 4px; font-size: 15px; line-height: 1.45; color: #A1A1AA; text-align: center; }
</style>
</head>
<body>
<main>
  <h1>PC 리모컨 · 꾹 누르면 실행</h1>
  <button type="button" data-action="screen-off" data-tone="off" data-done="PC 화면을 껐습니다.">
    <span class="fill"></span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
    <b>화면 끄기</b><small>꾹 누르기</small>
  </button>
  <button type="button" data-action="sleep" data-tone="sleep" data-done="PC가 절전에 들어갑니다. 다시 켜려면 PC에서 키보드나 마우스를 누르세요.">
    <span class="fill"></span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
    <b>절전</b><small>꾹 누르기</small>
  </button>
  <div id="status" role="status" aria-live="polite"></div>
</main>
<script>
(function () {
  var HOLD = 1200, status = document.getElementById('status');
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  function say(text, tone) { status.textContent = text; status.style.color = tone === 'bad' ? '#FCA5A5' : tone === 'good' ? '#8DE0C4' : '#A1A1AA'; }
  Array.prototype.forEach.call(document.querySelectorAll('button[data-action]'), function (button) {
    var fill = button.querySelector('.fill'), hint = button.querySelector('small');
    var state = 'idle', progress = 0, from = 0, start = 0, frame = 0;
    function draw() { fill.style.height = (progress * 100) + '%'; }
    function reset() { state = 'idle'; progress = 0; draw(); hint.textContent = '꾹 누르기'; button.classList.remove('active'); }
    // A timer rather than animation frames: some browsers pause frames, and the gauge must still finish on time.
    function tick() {
      var now = performance.now();
      if (state === 'holding') {
        progress = Math.min(1, from + (now - start) / HOLD);
        if (progress >= 1) { stop(); draw(); send(); return; }
      } else if (state === 'draining') {
        progress = Math.max(0, from - (now - start) / (HOLD / 4));
        if (progress <= 0) { stop(); reset(); return; }
      } else { stop(); return; }
      draw();
    }
    function run() { if (!frame) frame = setInterval(tick, 16); }
    function stop() { clearInterval(frame); frame = 0; }
    function press(e) {
      if (state !== 'idle' && state !== 'draining') return;
      e.preventDefault();
      try { button.setPointerCapture(e.pointerId); } catch (ignored) {}
      from = progress; start = performance.now(); state = 'holding';
      button.classList.add('active'); hint.textContent = '계속 누르세요'; run();
    }
    function cancel() {
      if (state !== 'holding') return;
      from = progress; start = performance.now(); state = 'draining'; hint.textContent = '꾹 누르기'; run();
    }
    function send() {
      state = 'sending'; hint.textContent = '보내는 중…';
      if (navigator.vibrate && navigator.userActivation && navigator.userActivation.hasBeenActive) navigator.vibrate(40);
      var controller = window.AbortController ? new AbortController() : null;
      var timer = setTimeout(function () { if (controller) controller.abort(); }, 6000);
      fetch(button.getAttribute('data-action'), { method: 'POST', headers: { 'X-Codex-Remote': '1' }, cache: 'no-store', signal: controller ? controller.signal : undefined })
        .then(function (response) { if (!response.ok) throw new Error(response.status); say(button.getAttribute('data-done'), 'good'); })
        .catch(function () { say('PC에 연결하지 못했습니다. 폰이 집 와이파이에 연결돼 있는지, PC와 미터기가 켜져 있는지 확인하세요.', 'bad'); })
        .then(function () { clearTimeout(timer); setTimeout(reset, 1500); });
    }
    button.addEventListener('pointerdown', press);
    button.addEventListener('pointerup', cancel);
    button.addEventListener('pointercancel', cancel);
    button.addEventListener('lostpointercapture', cancel);
    button.addEventListener('pointermove', function (e) {
      if (state !== 'holding') return;
      var r = button.getBoundingClientRect();
      if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) cancel();
    });
  });
})();
</script>
</body>
</html>
